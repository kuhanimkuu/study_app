[pytest]
asyncio_mode = auto
# server/db/session.py's `engine` is a module-level singleton (correct —
# it matches the real app's lifetime, one connection pool for the process,
# not one per request). pytest-asyncio's default is a fresh event loop per
# test function, which orphans asyncpg connections opened under a
# previous, already-closed loop on Windows (AttributeError / "Event loop
# is closed" during pool cleanup). Sharing one event loop for the whole
# session matches the engine's actual lifetime instead of fighting it.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
