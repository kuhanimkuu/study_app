services:
  - type: web
    name: study-os-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn server.main:app --host 0.0.0.0 --port $PORT
    # Lets Render's health checks (and zero-downtime deploy gating) use
    # the real liveness endpoint instead of just "did the process start" —
    # 2026-09-19, part of the same optimization pass as dropping
    # torch/transformers from this build (see requirements-local-model.txt).
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: study-os-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: 396041418818-nj9krnthuc95trqosmgpoun0tkg3h30k.apps.googleusercontent.com
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  - name: study-os-db
    plan: free
    postgresMajorVersion: "16"
